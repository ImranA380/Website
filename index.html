<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highway Rush</title>
<style>
body{margin:0;background:#222;overflow:hidden;font-family:Arial;

touch-action: none;
overscroll-behavior: none;
user-select: none;
-webkit-user-select: none;

}
canvas{display:block;background:#555}
#score{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:24px;
font-weight:bold;
}
#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
box-sizing:border-box;
}
button{
width:90px;
height:90px;
font-size:35px;
border:none;
border-radius:50%;
opacity:.8;
}
</style>

<link rel="stylesheet"
href="style.css">

</head>
<body>

<div id="score">Score: 0</div>

<div id="gameOver" style="
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
border-radius:15px;
text-align:center;
font-family:Arial;
box-shadow:0 10px 30px rgba(0,0,0,.4);
">
<h2>💥 Game Over</h2>
<p>Your Score:</p>
<p id="finalScore">0</p>
<button onclick="location.reload()">
Play Again
</button>
</div>

<canvas id="game"></canvas>

<div id="controls">
<div>
<button id="left">⬅️</button>
<button id="right">➡️</button>
</div>
</div>

<script>



const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
onresize=resize;

let car={
x:innerWidth/2-25,
y:innerHeight-120,
w:50,
h:90
};

let score=0;
let gameOver = false;
let traffic = {
  x: innerWidth / 2 - 25,
  y: -100,
  w: 50,
  h: 90
};
const leftBtn = document.getElementById("left");
const rightBtn = document.getElementById("right");

let moveLeft = false;
let moveRight = false;

leftBtn.onpointerdown = () => moveLeft = true;
leftBtn.onpointerup = () => moveLeft = false;
leftBtn.onpointercancel = () => moveLeft = false;

rightBtn.onpointerdown = () => moveRight = true;
rightBtn.onpointerup = () => moveRight = false;
rightBtn.onpointercancel = () => moveRight = false;

addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") moveLeft = true;
  if (e.key === "ArrowRight") moveRight = true;
});

addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") moveLeft = false;
  if (e.key === "ArrowRight") moveRight = false;
});

function game(){

if (gameOver) return;

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#444";
ctx.fillRect(canvas.width/2-120,0,240,canvas.height);

ctx.strokeStyle="white";
ctx.lineWidth=6;

for(let i=0;i<20;i++){
ctx.beginPath();
ctx.moveTo(canvas.width/2, i*60+(score%60));
ctx.lineTo(canvas.width/2,i*60+30+(score%60));
ctx.stroke();
}

if(moveLeft) car.x -= 6;
if(moveRight) car.x += 6;

car.x=Math.max(canvas.width/2-110,
Math.min(canvas.width/2+60,car.x));

ctx.fillStyle="red";
ctx.fillRect(car.x,car.y,car.w,car.h);

traffic.y += 5;

if (traffic.y > canvas.height) {
  traffic.y = -100;
  traffic.x = canvas.width / 2 - 110 + Math.random() * 170;
}

ctx.fillStyle = "blue";
ctx.fillRect(traffic.x, traffic.y, traffic.w, traffic.h);
if (
  !gameOver &&
  car.x < traffic.x + traffic.w &&
  car.x + car.w > traffic.x &&
  car.y < traffic.y + traffic.h &&
  car.y + car.h > traffic.y
) {
  gameOver = true;

  setTimeout(() => {
    
document.getElementById("finalScore").innerText = score;

document.getElementById("gameOver").style.display = "block";

  }, 100);
}
score++;

document.getElementById("score").innerText=
"Score: "+score;

requestAnimationFrame(game);

}

game();
</script>

<script src="game.js"></script>

</body>
</html>
