<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highway Rush</title>
<style>
body{margin:0;background:#222;overflow:hidden;font-family:Arial}
canvas{display:block;background:#555}
#score{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:24px;
font-weight:bold;
}
#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
box-sizing:border-box;
}
button{
width:90px;
height:90px;
font-size:35px;
border:none;
border-radius:50%;
opacity:.8;
}
</style>
</head>
<body>

<div id="score">Score: 0</div>

<canvas id="game"></canvas>

<div id="controls">
<div>
<button id="left">⬅️</button>
<button id="right">➡️</button>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
onresize=resize;

let car={
x:innerWidth/2-25,
y:innerHeight-120,
w:50,
h:90
};

let score=0;

let left=false;
let right=false;

left.onpointerdown=()=>left=true;
left.onpointerup=()=>left=false;

right.onpointerdown=()=>right=true;
right.onpointerup=()=>right=false;

addEventListener("keydown",e=>{
if(e.key=="ArrowLeft")left=true;
if(e.key=="ArrowRight")right=true;
});

addEventListener("keyup",e=>{
if(e.key=="ArrowLeft")left=false;
if(e.key=="ArrowRight")right=false;
});

function game(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#444";
ctx.fillRect(canvas.width/2-120,0,240,canvas.height);

ctx.strokeStyle="white";
ctx.lineWidth=6;

for(let i=0;i<20;i++){
ctx.beginPath();
ctx.moveTo(canvas.width/2, i*60+(score%60));
ctx.lineTo(canvas.width/2,i*60+30+(score%60));
ctx.stroke();
}

if(left)car.x-=6;
if(right)car.x+=6;

car.x=Math.max(canvas.width/2-110,
Math.min(canvas.width/2+60,car.x));

ctx.fillStyle="red";
ctx.fillRect(car.x,car.y,car.w,car.h);

score++;

document.getElementById("score").innerText=
"Score: "+score;

requestAnimationFrame(game);

}

game();
</script>

</body>
</html>
