<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The World's Most Important Website</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff7b00,#ff0080);
    color:white;
    text-align:center;
}

.container{
    max-width:800px;
    margin:80px auto;
    padding:20px;
}

h1{
    font-size:60px;
}

.card{
    background:white;
    color:#222;
    padding:25px;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

button{
    background:#111;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">

<h1>🚨 Warning! 🚨</h1>

<div class="card">
<h2>You have discovered...</h2>
<h1>ABSOLUTELY NOTHING.</h1>
<p>Congratulations! 🎉</p>
<p>Your reward is... another button.</p>
</div>

<button onclick="surprise()">Do NOT Click Me</button>

<p id="message" style="font-size:24px;margin-top:30px;"></p>

</div>

<script>
function surprise(){
    const messages=[
        "🍕 You owe the developer a pizza.",
        "😂 Nice try!",
        "🚀 Loading... Just kidding.",
        "🐈 A cat has approved your click.",
        "☕ Error 404: Motivation not found.",
        "🥔 Congratulations! You're now a Certified Potato.",
        "🤖 Beep boop. Human detected.",
        "🎉 You clicked the button. Incredible achievement!"
    ];

    document.getElementById("message").textContent=
        messages[Math.floor(Math.random()*messages.length)];
}
</script>

</body>
</html>
